name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Tilladelser som actions/deploy-pages kræver
permissions:
  contents: read
  pages: write
  id-token: write

# Tillad kun ét samtidigt deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Adressen på serverlaget, der slår nummerplader op. Den bages ind i
          # klient-bundlen ved build, og derfor skal den sættes her og ikke i
          # en .env-fil, som GitHub Actions ikke har adgang til.
          #
          # Det er en adresse, ikke en hemmelighed, så den må gerne stå her.
          # Selve MOTORAPI_TOKEN ligger hos Cloudflare og rører aldrig sitet.
          VITE_API_BASE_URL: https://minbilpris-api.sinan1.workers.dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
